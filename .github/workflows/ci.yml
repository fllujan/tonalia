name: CI

# Runs only on demand (Actions → CI → Run workflow) and from Release, which calls it
# with installers: false so a tag is never built without the full test suite passing.
# Pushes to main and pull requests do not trigger it.
on:
  workflow_dispatch:
    inputs:
      installers:
        description: Also build the installers and upload them as artifacts
        type: boolean
        default: true
  workflow_call:
    inputs:
      installers:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # uv's own Python everywhere, as in local builds: the runners' python.org framework
  # build ends up as a Python.framework in the engine, which notarization rejects.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri

      # ---- Engine (Python) ----
      - name: Engine — install
        working-directory: engine
        run: uv sync --all-groups --locked

      # Types are checked where the lock resolves numpy 2; Intel macOS gets numpy 1.26,
      # whose stubs differ.
      - name: Engine — lint and types
        working-directory: engine
        run: |
          uv run ruff check . ../scripts
          uv run ruff format --check . ../scripts
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            uv run mypy tonalia_engine tests tools
          fi
          uv run mypy --strict ../scripts/fetch_binaries.py ../scripts/build_engine.py ../scripts/updater_manifest.py ../scripts/bump_version.py ../scripts/third_party.py
          python3 ../scripts/bump_version.py --check

      # Engine tests decode audio fixtures with the bundled FFmpeg.
      - name: Fetch ffmpeg and rubberband
        run: uv run --project engine python scripts/fetch_binaries.py --target ${{ matrix.target }}

      # SPEC §3: at least 80 % coverage on keys, suggest, tags and export
      # (modules are added here as they land).
      # Each test is printed as it runs (unbuffered), a test stuck for 10 minutes dumps
      # every thread's traceback, and the step gives up after an hour instead of six.
      - name: Engine — tests
        working-directory: engine
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run pytest -vv -o faulthandler_timeout=600 --cov=tonalia_engine.keys --cov=tonalia_engine.tags --cov-report=term --cov-fail-under=80

      # ---- App (frontend) ----
      - name: App — install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App — lint, types, tests
        working-directory: app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm gen-types:check
          pnpm i18n:check

      # The Pro flow end to end: real engine (ffmpeg, Rubber Band) behind the real UI.
      - name: App — end-to-end smoke test
        working-directory: app
        run: pnpm test:e2e

      # ---- App (Rust) ----
      - name: Rust — fmt, clippy, tests
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # ---- Bundle ----
      - name: Build engine sidecar
        if: ${{ inputs.installers }}
        run: uv run --project engine python scripts/build_engine.py --target ${{ matrix.target }}

      - name: Build installers
        if: ${{ inputs.installers }}
        working-directory: app
        run: pnpm tauri build --config src-tauri/binaries/tauri.bundle.conf.json

      - name: Upload installers
        if: ${{ inputs.installers }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tonalia-${{ matrix.target }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
