name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri

      # ---- Engine (Python) ----
      - name: Engine — install
        working-directory: engine
        run: uv sync --all-groups --locked

      - name: Engine — lint and types
        working-directory: engine
        run: |
          uv run ruff check . ../scripts
          uv run ruff format --check . ../scripts
          uv run mypy tonalia_engine tests tools
          uv run mypy --strict ../scripts/fetch_binaries.py ../scripts/build_engine.py ../scripts/updater_manifest.py ../scripts/bump_version.py ../scripts/third_party.py
          python3 ../scripts/bump_version.py --check

      # Engine tests decode audio fixtures with the bundled FFmpeg.
      - name: Fetch ffmpeg and rubberband
        run: uv run --project engine python scripts/fetch_binaries.py --target ${{ matrix.target }}

      # SPEC §3: at least 80 % coverage on keys, suggest, tags and export
      # (modules are added here as they land).
      - name: Engine — tests
        working-directory: engine
        run: uv run pytest --cov=tonalia_engine.keys --cov=tonalia_engine.tags --cov-report=term --cov-fail-under=80

      # ---- App (frontend) ----
      - name: App — install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: App — lint, types, tests
        working-directory: app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm gen-types:check

      # The Pro flow end to end: real engine (ffmpeg, Rubber Band) behind the real UI.
      - name: App — end-to-end smoke test
        working-directory: app
        run: pnpm test:e2e

      # ---- App (Rust) ----
      - name: Rust — fmt, clippy, tests
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # ---- Bundle ----
      - name: Build engine sidecar
        run: uv run --project engine python scripts/build_engine.py --target ${{ matrix.target }}

      - name: Build installers
        working-directory: app
        run: pnpm tauri build --config src-tauri/binaries/tauri.bundle.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tonalia-${{ matrix.target }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
