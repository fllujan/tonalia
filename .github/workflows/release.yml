name: Release

# Push a tag `vX.Y.Z` (matching the version set with scripts/bump_version.py) to build signed installers for every platform and a draft GitHub Release
# with `latest.json` for the in-app updater (SPEC 10.2). Publishing the draft makes it the
# update the apps see. Needs the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (see docs/releasing.md).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # uv's own Python everywhere, as in local builds: the runners' python.org framework
  # build ends up as a Python.framework in the engine, which notarization rejects.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        run: |
          python3 scripts/bump_version.py --check
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $conf"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      installers: false

  build:
    name: ${{ matrix.name }}
    needs: [version, tests]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Engine — install
        working-directory: engine
        run: uv sync --all-groups --locked

      - name: Fetch ffmpeg and rubberband
        run: uv run --project engine python scripts/fetch_binaries.py --target ${{ matrix.target }}

      - name: App — install
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Developer ID (docs/signing.md): import the certificate into a throwaway keychain and
      # expose its identity; without the secret the build keeps the ad-hoc signature.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::no APPLE_CERTIFICATE secret: ad-hoc signature, not notarized"
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # The existing keychains stay in the search list (one path per word; bash 3.2).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n1)
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # A plain flag (not the key) makes build_engine.py ask Tauri for updater bundles;
      # only the step that signs them sees the signing key.
      - name: Build engine sidecar
        env:
          TONALIA_UPDATER_ARTIFACTS: "1"
        run: uv run --project engine python scripts/build_engine.py --target ${{ matrix.target }}

      # Tauri notarizes the app when the Apple ID variables are present (macOS only).
      - name: Build signed installers
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm tauri build --config src-tauri/binaries/tauri.bundle.conf.json

      - name: Check the macOS signature
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          app=$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vv "$app"

      # Tauri notarizes the app, but its stapling can miss while Apple's ticket propagates
      # (v0.1.0 on Intel). Notarize and staple the .dmg itself, retrying the staple, so the
      # installer opens without a network check; then the app inside is stapled if it can be.
      - name: Notarize and staple the disk image
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "::warning::no Apple ID secrets: the disk image is signed but not notarized"
            exit 0
          fi
          # Stapling and validating ask Apple's ticket service, which drops connections now
          # and then ("The network connection was lost", v0.1.2 on Intel): retry both.
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if xcrun stapler "$@"; then return 0; fi
              echo "stapler $1 attempt $attempt failed, retrying in 30 s"
              sleep 30
            done
            return 1
          }
          staple() { retry staple "$1"; }
          app=$(find app/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          staple "$app" || echo "::warning::the app could not be stapled (the .dmg still is)"
          for dmg in app/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait
            # notarytool --wait fails unless Apple accepted it, so the .dmg is notarized here.
            # If the ticket service stays unreachable (twice in a row for the Intel runner
            # in v0.1.2), do not throw the build away: the release stays a draft and the ticket
            # is stapled by hand before publishing (docs/releasing.md).
            if ! staple "$dmg"; then
              echo "::warning::$(basename "$dmg") is notarized but not stapled: staple it by hand before publishing"
              continue
            fi
            retry validate "$dmg"
            spctl -a -t open --context context:primary-signature -vv "$dmg"
          done

      # One folder per platform: installers for people, the updater bundle for the app.
      - name: Collect
        run: |
          bundle=app/src-tauri/target/release/bundle
          out="release/${{ matrix.platform }}"
          mkdir -p "$out/installers" "$out/updater"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bundle"/msi/*.msi "$bundle"/nsis/*-setup.exe "$out/installers/"
            cp "$bundle"/nsis/*-setup.exe "$bundle"/nsis/*-setup.exe.sig "$out/updater/"
          else
            for dmg in "$bundle"/dmg/*.dmg; do
              cp "$dmg" "$out/installers/"
            done
            cp "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig "$out/updater/"
          fi
          ls -R "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: release/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          pattern: release-*

      - name: Notes from the tag message
        run: |
          # actions/checkout turns the pushed tag into a lightweight one, whose "contents" are the
          # commit message: fetch the annotated tag itself, and never fall back to the commit.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          : > notes.md
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
              | sed -e '/^-----BEGIN PGP SIGNATURE-----$/,$d' > notes.md
          fi
          [ -n "$(tr -d '[:space:]' < notes.md)" ] || echo "Tonalia ${{ needs.version.outputs.version }}" > notes.md

      - name: latest.json
        run: |
          artifacts=()
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            file=$(find "release/release-$platform/updater" -type f ! -name '*.sig' | head -n1)
            artifacts+=(--artifact "$platform=$file")
          done
          python3 scripts/updater_manifest.py \
            --version "$GITHUB_REF_NAME" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --out dist \
            "${artifacts[@]}"
          cp release/release-*/installers/* dist/
          ls -l dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "Tonalia ${{ needs.version.outputs.version }}" \
            --notes-file notes.md
