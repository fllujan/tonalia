[project]
name = "tonalia-engine"
version = "0.1.0"
description = "Tonalia analysis engine (JSON-RPC sidecar)"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
tonalia-engine = "tonalia_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tonalia_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
