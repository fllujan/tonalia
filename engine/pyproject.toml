[project]
name = "tonalia-engine"
version = "0.1.0"
description = "Tonalia analysis engine (JSON-RPC sidecar)"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "mutagen>=1.47,<2",
    "einops>=0.8,<1",
    "julius>=0.2.7,<0.3",
    # PyTorch dropped Intel Macs after 2.2, and 2.2 needs NumPy 1.x (the engine supports both).
    "numpy>=2.1,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pydantic>=2.9,<3",
    "pyloudnorm>=0.1.1,<0.2",
    "scipy>=1.13,<2",
    # 2.11 is the last release whose macOS wheels support macOS 11 (2.12 needs macOS 14).
    "torch>=2.9,<2.12; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "xxhash>=3.5,<4",
]

[project.scripts]
tonalia-engine = "tonalia_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs>=1.17.1.5",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tonalia_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tonalia_engine/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tonalia_engine/vendor/"]

# Vendored third-party code (Demucs): followed for types, not checked.
[[tool.mypy.overrides]]
module = ["tonalia_engine.vendor.*", "julius", "einops"]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"

# pyloudnorm ships without type hints (only Meter.integrated_loudness is used).
[[tool.mypy.overrides]]
module = ["pyloudnorm", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

# mutagen ships without type hints; allow calling it only where tags are handled.
[[tool.mypy.overrides]]
module = [
    "tonalia_engine.metadata",
    "tonalia_engine.tags.*",
    "tonalia_engine.export.serato_markers",
    "tests.test_metadata",
    "tests.test_library",
    "tests.test_tags_writer",
    "tests.test_tags_rpc",
    "tools.make_test_library",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
